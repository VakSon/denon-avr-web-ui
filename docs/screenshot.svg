<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="828" viewBox="0 0 1000 828" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif">
  <defs>
    <style>
      .surface { fill: #171a21; }
      .surface2 { fill: #1f232c; }
      .card { fill: #171a21; stroke: #2a2f3a; stroke-width: 1; }
      .chip { fill: #1f232c; stroke: #2a2f3a; stroke-width: 1; }
      .txt { fill: #e7eaf0; }
      .muted { fill: #8a91a0; }
      .accent { fill: #3b82f6; }
      .ok { fill: #22c55e; }
      .h3 { fill: #8a91a0; font-size: 12px; letter-spacing: 1.2px; font-weight: 700; }
      .lbl { fill: #8a91a0; font-size: 11px; letter-spacing: .6px; }
      .chiptxt { fill: #e7eaf0; font-size: 13px; }
    </style>
  </defs>

  <!-- page bg -->
  <rect width="1000" height="828" fill="#0f1115"/>

  <!-- top bar -->
  <rect width="1000" height="56" class="surface"/>
  <line x1="0" y1="56" x2="1000" y2="56" stroke="#2a2f3a"/>
  <text x="24" y="35" font-size="20" font-weight="700"><tspan class="txt">Denon</tspan><tspan class="accent" font-weight="400">Control</tspan></text>
  <rect x="828" y="14" width="148" height="30" rx="9" fill="none" stroke="#2a2f3a"/>
  <text x="902" y="33" text-anchor="middle" class="txt" font-size="13">+ Add receiver</text>

  <!-- sidebar -->
  <text x="24" y="96" class="h3">RECEIVERS</text>
  <rect x="24" y="108" width="240" height="58" rx="12" class="surface2" stroke="#3b82f6"/>
  <circle cx="44" cy="137" r="5" class="ok"/>
  <text x="60" y="132" class="txt" font-size="14" font-weight="600">Living Room</text>
  <text x="60" y="150" class="muted" font-size="12">192.168.1.50</text>

  <!-- ============ PANEL ============ x=288..976 ============ -->

  <!-- device head card -->
  <rect x="288" y="76" width="688" height="88" rx="12" class="card"/>
  <text x="308" y="118" class="txt" font-size="24" font-weight="700">Living Room</text>
  <text x="308" y="142" class="muted" font-size="13">192.168.1.50 ·</text>
  <rect x="404" y="130" width="86" height="18" rx="9" fill="none" stroke="#22c55e"/>
  <text x="447" y="143" text-anchor="middle" class="ok" font-size="11">connected</text>
  <circle cx="930" cy="120" r="26" class="ok"/>
  <text x="930" y="129" text-anchor="middle" fill="#06240f" font-size="22">⏻</text>

  <!-- volume card -->
  <rect x="288" y="176" width="688" height="132" rx="12" class="card"/>
  <text x="308" y="204" class="h3">VOLUME</text>
  <text x="308" y="252" class="txt" font-size="40" font-weight="700">-33.5<tspan class="muted" font-size="16" font-weight="400"> dB</tspan></text>
  <rect x="770" y="222" width="46" height="46" rx="10" class="chip"/>
  <text x="793" y="251" text-anchor="middle" class="txt" font-size="20">−</text>
  <rect x="824" y="222" width="46" height="46" rx="10" class="chip"/>
  <text x="847" y="250" text-anchor="middle" class="txt" font-size="20">+</text>
  <rect x="878" y="228" width="78" height="34" rx="17" class="chip"/>
  <text x="917" y="250" text-anchor="middle" class="txt" font-size="13">🔊 Mute</text>
  <!-- slider -->
  <rect x="308" y="286" width="648" height="6" rx="3" class="surface2"/>
  <rect x="308" y="286" width="300" height="6" rx="3" class="accent"/>
  <circle cx="608" cy="289" r="11" class="accent" stroke="#171a21" stroke-width="3"/>
  <text x="308" y="304" class="muted" font-size="12">-80 dB</text>
  <text x="956" y="304" text-anchor="end" class="muted" font-size="12">12 dB (max)</text>

  <!-- input source card -->
  <rect x="288" y="320" width="688" height="96" rx="12" class="card"/>
  <text x="308" y="348" class="txt" font-size="13" font-weight="700">Input source</text>
  <rect x="392" y="337" width="66" height="18" rx="9" fill="none" stroke="#22c55e"/>
  <text x="425" y="350" text-anchor="middle" class="ok" font-size="11">now: PC</text>
  <rect x="882" y="335" width="74" height="26" rx="13" fill="none" stroke="#2a2f3a"/>
  <text x="919" y="352" text-anchor="middle" class="muted" font-size="12">✎ Rename</text>
  <!-- chips -->
  <rect x="308" y="372" width="52" height="30" rx="15" class="accent"/>
  <text x="334" y="391" text-anchor="middle" fill="#fff" font-size="13">PC</text>
  <rect x="368" y="372" width="86" height="30" rx="15" class="chip"/>
  <text x="411" y="391" text-anchor="middle" class="chiptxt">TV Audio</text>
  <rect x="462" y="372" width="92" height="30" rx="15" class="chip"/>
  <text x="508" y="391" text-anchor="middle" class="chiptxt">Cable Box</text>
  <rect x="562" y="372" width="66" height="30" rx="15" class="chip"/>
  <text x="595" y="391" text-anchor="middle" class="chiptxt">Tuner</text>

  <!-- sound mode card -->
  <rect x="288" y="428" width="688" height="100" rx="12" class="card"/>
  <text x="308" y="456" class="h3">SOUND MODE</text>
  <g font-size="13">
    <rect x="308" y="474" width="66" height="30" rx="15" class="chip"/><text x="341" y="493" text-anchor="middle" class="chiptxt">Movie</text>
    <rect x="382" y="474" width="66" height="30" rx="15" class="chip"/><text x="415" y="493" text-anchor="middle" class="chiptxt">Music</text>
    <rect x="456" y="474" width="66" height="30" rx="15" class="chip"/><text x="489" y="493" text-anchor="middle" class="chiptxt">Game</text>
    <rect x="530" y="474" width="60" height="30" rx="15" class="chip"/><text x="560" y="493" text-anchor="middle" class="chiptxt">Auto</text>
    <rect x="598" y="474" width="70" height="30" rx="15" class="accent"/><text x="633" y="493" text-anchor="middle" fill="#fff">Dolby</text>
    <rect x="676" y="474" width="70" height="30" rx="15" class="chip"/><text x="711" y="493" text-anchor="middle" class="chiptxt">Stereo</text>
    <rect x="754" y="474" width="66" height="30" rx="15" class="chip"/><text x="787" y="493" text-anchor="middle" class="chiptxt">Direct</text>
    <rect x="828" y="474" width="98" height="30" rx="15" class="chip"/><text x="877" y="493" text-anchor="middle" class="chiptxt">Pure Direct</text>
  </g>

  <!-- now playing card -->
  <rect x="288" y="540" width="688" height="108" rx="12" class="card"/>
  <text x="308" y="568" class="h3">NOW PLAYING</text>
  <g>
    <!-- 4 cells -->
    <g>
      <rect x="308" y="582" width="152" height="50" rx="10" class="surface2" stroke="#2a2f3a"/>
      <text x="322" y="602" class="lbl">SPEAKER OUTPUT</text><circle cx="418" cy="598" r="7" class="chip" stroke="#2a2f3a"/><text x="418" y="601" text-anchor="middle" class="muted" font-size="9">?</text>
      <text x="322" y="622" class="txt" font-size="17" font-weight="700">5.1</text>
    </g>
    <g>
      <rect x="472" y="582" width="152" height="50" rx="10" class="surface2" stroke="#2a2f3a"/>
      <text x="486" y="602" class="lbl">SOUND MODE</text><circle cx="566" cy="598" r="7" class="chip" stroke="#2a2f3a"/><text x="566" y="601" text-anchor="middle" class="muted" font-size="9">?</text>
      <text x="486" y="622" class="txt" font-size="15" font-weight="700">Dolby Digital</text>
    </g>
    <g>
      <rect x="636" y="582" width="152" height="50" rx="10" class="surface2" stroke="#2a2f3a"/>
      <text x="650" y="602" class="lbl">INPUT SIGNAL</text><circle cx="726" cy="598" r="7" class="chip" stroke="#2a2f3a"/><text x="726" y="601" text-anchor="middle" class="muted" font-size="9">?</text>
      <text x="650" y="622" class="txt" font-size="15" font-weight="700">Dolby Digital</text>
    </g>
    <g>
      <rect x="800" y="582" width="152" height="50" rx="10" class="surface2" stroke="#2a2f3a"/>
      <text x="814" y="602" class="lbl">SAMPLE RATE</text><circle cx="886" cy="598" r="7" class="chip" stroke="#2a2f3a"/><text x="886" y="601" text-anchor="middle" class="muted" font-size="9">?</text>
      <text x="814" y="622" class="txt" font-size="17" font-weight="700">48 kHz</text>
    </g>
  </g>

  <!-- channel levels card -->
  <rect x="288" y="660" width="688" height="152" rx="12" class="card"/>
  <text x="308" y="688" class="h3">CHANNEL LEVELS</text>
  <!-- helper rows: name, −, value(color), + -->
  <g font-size="14">
    <!-- row template repeated -->
    <!-- Front Left -->
    <rect x="308" y="700" width="316" height="34" rx="10" class="surface2" stroke="#2a2f3a"/>
    <text x="322" y="722" class="txt">Front Left</text>
    <rect x="510" y="705" width="24" height="24" rx="7" class="chip"/><text x="522" y="722" text-anchor="middle" class="txt">−</text>
    <text x="562" y="722" text-anchor="middle" class="txt" font-weight="600">0.0 dB</text>
    <rect x="592" y="705" width="24" height="24" rx="7" class="chip"/><text x="604" y="722" text-anchor="middle" class="txt">+</text>
    <!-- Front Right -->
    <rect x="640" y="700" width="316" height="34" rx="10" class="surface2" stroke="#2a2f3a"/>
    <text x="654" y="722" class="txt">Front Right</text>
    <rect x="842" y="705" width="24" height="24" rx="7" class="chip"/><text x="854" y="722" text-anchor="middle" class="txt">−</text>
    <text x="894" y="722" text-anchor="middle" class="txt" font-weight="600">0.0 dB</text>
    <rect x="924" y="705" width="24" height="24" rx="7" class="chip"/><text x="936" y="722" text-anchor="middle" class="txt">+</text>
    <!-- Center -->
    <rect x="308" y="740" width="316" height="34" rx="10" class="surface2" stroke="#2a2f3a"/>
    <text x="322" y="762" class="txt">Center</text>
    <rect x="510" y="745" width="24" height="24" rx="7" class="chip"/><text x="522" y="762" text-anchor="middle" class="txt">−</text>
    <text x="562" y="762" text-anchor="middle" class="accent" font-weight="600">-2.0 dB</text>
    <rect x="592" y="745" width="24" height="24" rx="7" class="chip"/><text x="604" y="762" text-anchor="middle" class="txt">+</text>
    <!-- Subwoofer -->
    <rect x="640" y="740" width="316" height="34" rx="10" class="surface2" stroke="#2a2f3a"/>
    <text x="654" y="762" class="txt">Subwoofer</text>
    <rect x="842" y="745" width="24" height="24" rx="7" class="chip"/><text x="854" y="762" text-anchor="middle" class="txt">−</text>
    <text x="894" y="762" text-anchor="middle" class="ok" font-weight="600">+2.0 dB</text>
    <rect x="924" y="745" width="24" height="24" rx="7" class="chip"/><text x="936" y="762" text-anchor="middle" class="txt">+</text>
    <!-- Surround Left -->
    <rect x="308" y="780" width="316" height="34" rx="10" class="surface2" stroke="#2a2f3a"/>
    <text x="322" y="802" class="txt">Surround Left</text>
    <rect x="510" y="785" width="24" height="24" rx="7" class="chip"/><text x="522" y="802" text-anchor="middle" class="txt">−</text>
    <text x="562" y="802" text-anchor="middle" class="txt" font-weight="600">0.0 dB</text>
    <rect x="592" y="785" width="24" height="24" rx="7" class="chip"/><text x="604" y="802" text-anchor="middle" class="txt">+</text>
    <!-- Surround Right -->
    <rect x="640" y="780" width="316" height="34" rx="10" class="surface2" stroke="#2a2f3a"/>
    <text x="654" y="802" class="txt">Surround Right</text>
    <rect x="842" y="785" width="24" height="24" rx="7" class="chip"/><text x="854" y="802" text-anchor="middle" class="txt">−</text>
    <text x="894" y="802" text-anchor="middle" class="txt" font-weight="600">0.0 dB</text>
    <rect x="924" y="785" width="24" height="24" rx="7" class="chip"/><text x="936" y="802" text-anchor="middle" class="txt">+</text>
  </g>
</svg>
